<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Nunito",system-ui,sans-serif;
    background:#fff;color:#111;
    padding:24px;
  }
  h1{
    font-size:18px;font-weight:700;
    margin-bottom:24px;
  }

  /* the mosaic */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:0;
  }
  .grid img{
    width:100%;
    aspect-ratio:3/2;       /* uniform landscape tiles */
    object-fit:cover;       /* thumbnail crops; full image shows uncropped */
    display:block;
    cursor:pointer;
    background:#eee;
  }

  /* full-screen overlay */
  .overlay{
    position:fixed;inset:0;
    background:transparent;
    display:none;
    align-items:center;justify-content:center;
    z-index:100;
  }
  .overlay.open{display:flex}
  .box{
    display:flex;flex-direction:column;
    max-width:94vw;
  }
  .overlay img{
    max-width:100%;max-height:86vh;
    object-fit:contain;
    cursor:pointer;
    transition: filter 0.3s ease;
}
  }
  .cap{
    margin-top:14px;
    font-size:13px;color:#111;
    text-align:left;
    display:none;
  }
  footer{
    margin-top:24px;
    font-size:13px;
  }
  footer a{color:#111;text-decoration:none;border-bottom:1px solid #ccc}
  footer a:hover{border-color:#111}

  <div class="overlay" id="overlay">
    <div class="box">
      <img id="full" src="" alt="">
      <div class="cap" id="cap"></div>
    </div>
  </div>

<script>
  const imgs    = [...document.querySelectorAll('#grid img')];
  const overlay = document.getElementById('overlay');
  const full    = document.getElementById('full');
  const cap     = document.getElementById('cap');
  let i = 0;

function show(n){
  i = (n + imgs.length) % imgs.length;
  const tiny = imgs[i].dataset.tiny;
  const srcFull = imgs[i].dataset.full;
  const title = imgs[i].dataset.title || "";
  cap.textContent = title;
  cap.style.display = title ? "block" : "none";

  // decode tiny first, then show overlay (prevents flash of old image)
  const tinyImg = new Image();
  tinyImg.src = tiny;
  tinyImg.decode().catch(()=>{}).then(()=>{
    full.src = tiny;
    full.style.filter = "blur(20px)";
    overlay.classList.add('open');

    // now load the full image; swap in when ready
    const pre = new Image();
    pre.src = srcFull;
    pre.decode().catch(()=>{}).then(()=>{
      if (imgs[i].dataset.full === srcFull) {
        full.src = srcFull;
        full.style.filter = "none";
      }
    });
  });

  // preload the next one
  const nxt = imgs[(i+1) % imgs.length];
  if (nxt) new Image().src = nxt.dataset.full;
}
  function close(){ overlay.classList.remove('open'); }

  imgs.forEach((img,n)=> img.addEventListener('click',()=>show(n)));
  full.addEventListener('click', e=>{ e.stopPropagation(); show(i+1); });
  overlay.addEventListener('click', close);
  document.addEventListener('keydown', e=>{
    if(!overlay.classList.contains('open')) return;
    if(e.key==='Escape') close();
    if(e.key==='ArrowLeft') show(i-1);
    if(e.key==='ArrowRight') show(i+1);
  });
</script>
